# Supabase local development configuration.
#
# Generated by hand; `supabase init` will produce the canonical file for the
# installed CLI version, and keys do move between versions. When first running
# the CLI, diff this against a freshly generated config and keep the settings
# called out below — they encode requirements, not preferences.

project_id = "scripture-bridge"

[api]
enabled = true
port = 54321
# R-SCHEMA-2: PostgREST exposes `api` only. `app` and `ref` are unreachable over
# HTTP even if a policy is later misconfigured.
schemas = ["api"]
extra_search_path = ["extensions"]
# R-API-DB-2: collection endpoints must paginate. Do not leave this unbounded.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# R-PLAT-DB-1: Postgres 15+. `security_invoker` views, `IS NFC NORMALIZED`, and
# pg_snapshot_xmin() all depend on it. Must match the hosted project's version,
# or local passes tests production will not.
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local mail catcher. No SMTP provider is configured for the translator flow
# (R-AUTH-DB-3): accounts are created pre-confirmed against synthetic addresses,
# so no confirmation, recovery, or notification mail is ever sent.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Font assets (R-STORE-1). Bumped above the default for large Class D fonts.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []

# R-AUTH-DB-4: 1 hour access tokens.
jwt_expiry = 3600

# R-AUTH-DB-9: sessions persist indefinitely. Rotation on; no refresh-token
# expiry, no inactivity timeout, no session time-box. A translator enters a
# password once per device, ever.
enable_refresh_token_rotation = true

# R-AUTH-DB-10: the default (~10s) assumes a client whose renewal response
# arrives. A response lost in a dead zone leaves the client holding a retired
# token, and the retry locks the user out irrecoverably. 300s minimum.
refresh_token_reuse_interval = 300

# R-AUTH-DB-1: no self-registration, anywhere. Accounts are created by an
# administrator through the admin API with the service key.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
# Accounts are created with email_confirm = true by the console (R-AUTH-DB-5).
enable_confirmations = false
double_confirm_changes = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# R-AUTH-DB-2: email/password only. No OAuth provider is enabled, which also
# avoids the account-picker mis-attribution hazard on shared devices.
